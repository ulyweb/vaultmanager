<style>/* VaultManager — "dashboard-telemetry" visual system shared with ulyOS (CryptoCompass, QR Seal, System Vault). */
:root {
  color-scheme: dark;
  --bg: #05080d; --bg-2: #070c14; --panel: #0a121c; --panel-2: #0c1622; --raise: #0f1c2b;
  --line: #152534; --line-2: #1e3345; --ink: #cddbe9; --ink-dim: #8ba2b8; --muted: #6a8197; --faint: #33475a;
  --accent: #2fe6d0; --accent-ink: #062b28; --accent-2: #7dff9b; --warn: #ffb547; --danger: #ff5165; --link: #59b4ff; --violet: #8b7dff;
  --grid: rgba(var(--accent-rgb),.06); --glow: 0 0 24px rgba(var(--accent-rgb),.25);
  --glass: rgba(12,22,34,.72); --glass-line: rgba(255,255,255,.09); --shadow: rgba(0,0,0,.45);
  --mono: "Cascadia Mono", "Cascadia Code", ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: "Segoe UI Variable Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
  --r: 12px; --accent-rgb: 47,230,208;
}
:root[data-theme="light"] {
  color-scheme: light; --accent-rgb: 10,143,127;
  --bg: #eef2f6; --bg-2: #e6ecf2; --panel: #ffffff; --panel-2: #f4f7fa; --raise: #ffffff; --line: #d6dfe8; --line-2: #c2cfdb;
  --ink: #182430; --ink-dim: #3d4f60; --muted: #5d6f80; --faint: #9db0c0;
  --accent: #0a8f7f; --accent-ink: #ffffff; --accent-2: #159a4b; --warn: #b36b00; --danger: #c8283e; --link: #1a6fc4; --violet: #5b4bd6;
  --grid: rgba(10,143,127,.07); --glow: 0 0 18px rgba(10,143,127,.16); --glass: rgba(255,255,255,.82); --glass-line: rgba(0,0,0,.08); --shadow: rgba(30,50,70,.16);
}

* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  background:
    radial-gradient(1200px 700px at 80% -10%, rgba(var(--accent-rgb),.06), transparent 60%),
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 40px 40px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 40px 40px, var(--bg);
  color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
a { color: var(--link); }
::selection { background: var(--accent); color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.offscreen { position: fixed; left: -9999px; top: 0; opacity: 0; }
.noscript { padding: 24px; text-align: center; }
[hidden] { display: none !important; }

.aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.aurora i { position: absolute; border-radius: 50%; filter: blur(80px); opacity: calc(var(--fx-aurora, 65) / 100 * .34); animation: drift 30s ease-in-out infinite alternate; }
.aurora .g1 { width: 46vw; height: 46vw; background: radial-gradient(circle, var(--accent), transparent 70%); top: -14%; left: -10%; }
.aurora .g2 { width: 40vw; height: 40vw; background: radial-gradient(circle, var(--violet), transparent 70%); bottom: -16%; right: -6%; animation-delay: -10s; }
.aurora .g3 { width: 30vw; height: 30vw; background: radial-gradient(circle, #ffcf5c, transparent 70%); top: 40%; left: 40%; opacity: calc(var(--fx-aurora, 65) / 100 * .12); animation-delay: -18s; }
@keyframes drift { to { transform: translate(5%, 7%) scale(1.08); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

#app { position: relative; z-index: 1; min-height: 100vh; }

/* ---------- buttons / inputs ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .03em; transition: .15s; white-space: nowrap; }
.btn:hover { border-color: var(--accent); background: var(--raise); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 2px 12px rgba(var(--accent-rgb),.25); }
.btn.primary:hover { filter: brightness(1.08); box-shadow: var(--glow); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, transparent); }
.btn.danger:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn.sm { min-height: 28px; padding: 0 9px; font-size: 11px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-dim); }
.btn.ghost:hover { color: var(--ink); background: var(--raise); border-color: var(--line); }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); color: var(--ink-dim); font-size: 14px; transition: .15s; }
.icon-btn:hover { color: var(--ink); border-color: var(--accent); background: var(--raise); }
.icon-btn.on { color: var(--accent); border-color: var(--accent); }

.inp, .sel, .ta { width: 100%; min-height: 38px; padding: 8px 11px; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 9px; color: var(--ink); transition: border-color .15s; }
.inp:focus, .sel:focus, .ta:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),.14); }
.ta { min-height: 90px; resize: vertical; font-family: var(--mono); font-size: 12.5px; }
.field { margin-bottom: 14px; }
.field > label, .lbl { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.row > .grow { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.chk { display: flex; gap: 8px; align-items: center; cursor: pointer; font-size: 13px; }
.chk input { width: 16px; height: 16px; accent-color: var(--accent); }
.err { color: var(--danger); min-height: 1.4em; margin: 6px 0 0; font-size: 12.5px; }
.hint { color: var(--muted); font-size: 12px; margin: 5px 0 0; }
.sub { color: var(--muted); margin: 2px 0 0; font-size: 12.5px; }
input[type=range] { width: 100%; accent-color: var(--accent); }

/* ---------- panels ---------- */
.panel { background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.01)), var(--glass); -webkit-backdrop-filter: blur(var(--blur,12px)) saturate(150%); backdrop-filter: blur(var(--blur,12px)) saturate(150%); border: 1px solid var(--glass-line); border-radius: var(--r); box-shadow: 0 16px 45px var(--shadow); }
.panel.pad { padding: 18px; }
.panel h3 { margin: 0 0 12px; font-family: var(--mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.note { padding: 10px 12px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--panel-2); font-size: 12.5px; color: var(--ink-dim); margin: 0 0 12px; }
.note.warn { border-color: color-mix(in srgb, var(--warn) 50%, transparent); color: var(--warn); }
.note.danger { border-color: color-mix(in srgb, var(--danger) 55%, transparent); color: var(--danger); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 12.5px; }
.kv span { color: var(--muted); } .kv b { font-family: var(--mono); font-weight: 600; word-break: break-all; }

/* ---------- lock / create screen ---------- */
.gate { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.gate-card { width: min(440px, 100%); padding: 28px 26px; }
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.brand img { width: 44px; height: 44px; }
.brand h1 { margin: 0; font-family: var(--mono); font-size: 22px; letter-spacing: .02em; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 0; color: var(--muted); font-size: 12px; }
.pwwrap { position: relative; }
.pwwrap .inp { padding-right: 44px; }
.pwwrap .eye { position: absolute; right: 4px; top: 4px; }
.meter { height: 6px; border-radius: 99px; background: var(--raise); overflow: hidden; margin: 8px 0 4px; border: 1px solid var(--line); }
.meter i { display: block; height: 100%; width: 0; transition: width .25s, background .25s; background: var(--danger); }
.meter i.s1 { background: var(--warn); } .meter i.s2 { background: #d6d04a; } .meter i.s3 { background: var(--accent-2); } .meter i.s4 { background: var(--accent); }
.meter-label { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.trust { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line-2); font-family: var(--mono); font-size: 10.5px; color: var(--ink-dim); background: var(--panel-2); }
.chip.accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.chip.bad { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, transparent); }
.linkbtn { color: var(--link); text-decoration: underline; padding: 0; font-size: 12.5px; }

/* ---------- app shell ---------- */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.topbar .logo { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-weight: 800; letter-spacing: .02em; font-size: 15px; }
.topbar .logo img { width: 26px; height: 26px; } .topbar .logo span { color: var(--accent); }
.topbar .search { flex: 1; max-width: 520px; margin: 0 auto 0 12px; }
.shell { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 56px); }
.side { padding: 14px 10px; border-right: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 70%, transparent); position: sticky; top: 56px; align-self: start; max-height: calc(100vh - 56px); overflow-y: auto; }
.side h4 { margin: 16px 8px 6px; font-family: var(--mono); font-size: 10px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.nav { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px; border-radius: 9px; color: var(--ink-dim); text-align: left; font-size: 13px; transition: .12s; border: 1px solid transparent; }
.nav:hover { background: var(--raise); color: var(--ink); }
.nav.on { background: rgba(var(--accent-rgb),.1); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 28%, transparent); }
.nav .ic { width: 20px; text-align: center; }
.nav .n { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.nav .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); margin-left: auto; }
.main { padding: 16px; min-width: 0; }
.page { max-width: 880px; margin: 0 auto; }
.page > h2 { margin: 4px 0 4px; font-family: var(--mono); font-size: 20px; }
.page > .sub { margin-bottom: 16px; }
.page .panel { margin-bottom: 16px; }

.split { display: grid; grid-template-columns: minmax(260px, 380px) 1fr; gap: 16px; align-items: start; }
.list { overflow: hidden; }
.list-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.items { max-height: calc(100vh - 170px); overflow-y: auto; }
.item { display: flex; gap: 11px; align-items: center; width: 100%; padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); transition: background .12s; }
.item:hover { background: var(--raise); }
.item.on { background: rgba(var(--accent-rgb),.1); box-shadow: inset 3px 0 0 var(--accent); }
.avatar { flex: 0 0 auto; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; font-family: var(--mono); font-size: 15px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
.item .t { min-width: 0; flex: 1; }
.item .t b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .t small { display: block; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.item .star { color: #ffcf5c; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.empty .big { font-size: 40px; margin-bottom: 8px; }

.detail { padding: 18px 20px; position: sticky; top: 72px; }
.detail-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.detail-head h2 { margin: 0; font-size: 20px; word-break: break-word; }
.detail-head .avatar { width: 48px; height: 48px; font-size: 20px; border-radius: 13px; }
.detail-actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
.f { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
.f .k { flex: 0 0 96px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.f .v { flex: 1; min-width: 0; word-break: break-all; }
.f .v.secret { font-family: var(--mono); letter-spacing: .04em; }
.f .v.pre { white-space: pre-wrap; word-break: break-word; }
.f .acts { display: flex; gap: 4px; }
.totp-code { font-family: var(--mono); font-size: 22px; letter-spacing: .14em; color: var(--accent); }
.totp-bar { height: 3px; background: var(--raise); border-radius: 3px; margin-top: 4px; overflow: hidden; } .totp-bar i { display: block; height: 100%; background: var(--accent); transition: width 1s linear; }
.tags { display: flex; gap: 5px; flex-wrap: wrap; }
.back { display: none; }

/* ---------- generator ---------- */
.genout { font-family: var(--mono); font-size: 20px; line-height: 1.4; padding: 14px 16px; border-radius: 11px; background: var(--bg-2); border: 1px solid var(--line-2); word-break: break-all; min-height: 62px; }
.genout .d { color: var(--link); } .genout .s { color: var(--warn); } .genout .u { color: var(--accent); }
.seg { display: inline-flex; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); }
.seg button { padding: 5px 12px; border-radius: 7px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.seg button.on { background: rgba(var(--accent-rgb),.16); color: var(--accent); }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px 14px; margin: 12px 0; }

/* ---------- health ---------- */
.score { display: flex; align-items: center; gap: 18px; }
.ring { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-size: 26px; font-weight: 800; background: conic-gradient(var(--c, var(--accent)) calc(var(--p) * 1%), var(--raise) 0); position: relative; }
.ring::before { content: ''; position: absolute; inset: 8px; border-radius: 50%; background: var(--panel); } .ring span { position: relative; }
.hl { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.hl .t { flex: 1; min-width: 0; } .hl small { color: var(--muted); display: block; }

/* ---------- QR ---------- */
.qrbox { display: grid; place-items: center; padding: 14px; }
.qrbox canvas { max-width: min(100%, 360px); height: auto; image-rendering: pixelated; border-radius: 10px; background: #fff; }
.qrgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.qrgrid figure { margin: 0; text-align: center; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.qrgrid canvas { width: 100%; height: auto; border-radius: 8px; background: #fff; image-rendering: pixelated; }
.scanner { position: relative; border-radius: 12px; overflow: hidden; background: #000; max-width: 420px; margin: 8px auto; border: 1px solid var(--line-2); }
.scanner video { display: block; width: 100%; max-height: 320px; object-fit: cover; }
.progress { height: 8px; border-radius: 99px; background: var(--raise); overflow: hidden; border: 1px solid var(--line); } .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .2s; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 14px; }
.tabs button { padding: 7px 13px; border-radius: 9px; font-family: var(--mono); font-size: 12px; color: var(--muted); border: 1px solid var(--line); }
.tabs button.on { color: var(--accent); border-color: var(--accent); background: rgba(var(--accent-rgb),.08); }

/* ---------- modal ---------- */
.modal-overlay { position: fixed; inset: 0; z-index: 500; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(2,4,8,.8); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
:root[data-theme="light"] .modal-overlay { background: rgba(30,45,60,.45); }
.modal-sheet { width: min(560px, 100%); max-height: min(90vh, 100%); display: flex; flex-direction: column; border-radius: calc(var(--r, 12px) + 4px); background: var(--panel); border: 1px solid var(--line); box-shadow: 0 25px 70px rgba(0,0,0,.6), var(--glow); animation: pop calc(.2s / var(--speed, 1)) cubic-bezier(.2,.8,.2,1); overflow: hidden; }
.modal-sheet.wide { width: min(820px, 100%); }
@keyframes pop { from { opacity: 0; transform: scale(.97) translateY(10px); } }
.modal-header { display: flex; align-items: flex-start; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
.modal-header > div { flex: 1; min-width: 0; } .modal-header h2 { margin: 0; font-family: var(--mono); font-size: 17px; }
.modal-close { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); color: var(--muted); } .modal-close:hover { color: var(--ink); border-color: var(--accent); }
.modal-body { padding: 18px 20px; overflow-y: auto; flex: 1; min-height: 0; }
.modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--panel-2); }
@media (max-width: 540px) { .modal-footer { flex-direction: column-reverse; } .modal-footer .btn { width: 100%; } }

.dock { position: fixed; left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30; display: none; gap: 4px; align-items: flex-end; padding: 8px 10px; max-width: calc(100vw - 16px); overflow-x: auto; border-radius: calc(var(--r, 12px) + 10px); background: var(--glass); -webkit-backdrop-filter: blur(var(--blur)) saturate(150%); backdrop-filter: blur(var(--blur)) saturate(150%); border: 1px solid var(--glass-line); box-shadow: 0 14px 40px var(--shadow), 0 0 calc(var(--fx-glow) * .5px) rgba(var(--accent-rgb), calc(var(--fx-glow) / 100 * .55)); transition: transform .25s, opacity .25s; scrollbar-width: none; }

  background: radial-gradient(80% 70% at 30% 20%, rgba(var(--accent-rgb), .22), transparent 60%), radial-gradient(70% 60% at 80% 90%, rgba(139,125,255,.18), transparent 60%), rgba(3,6,12,.9); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }

/* =====================================================================================
   App style (phones and tablets): large titles, inset grouped lists, a navigation bar on detail screens,
   bottom sheets with a grab handle, slide transitions and native-feeling touch behaviour.
   ===================================================================================== */
.apptitle, .disc, .detail-nav, .grabber { display: none; }
.fgroup { display: contents; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
@media (pointer: coarse), (max-width: 1023px) {
  body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
  .btn, .nav, .item, .mbar-item, .mbar-fab, .dock-item, .tabs button, .msheet-item, .icon-btn, .seg button, .navback, .navedit { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
  .btn:active, .item:active, .nav:active, .mbar-item:active, .msheet-item:active, .icon-btn:active { transform: scale(.97); transition-duration: .06s; }
  .item:active { background: var(--raise); transform: none; }
}
@media (max-width: 1023px) {
  /* inset grouped list, like Settings / Passwords on iOS */

  .item:last-child::after { display: none; }

  .item .clip + .disc, .item .star + .disc { margin-left: 4px; } .item .clip, .item .star { margin-left: auto; } .item .clip + .star { margin-left: 4px; }

  /* detail screen: nav bar, centred header, grouped fields */
  .detail { background: none; border: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; padding: 0; overflow: visible; }
  .detail::before { display: none; }
  .detail-nav { display: flex; align-items: center; gap: 10px; min-height: 44px; margin: -4px 0 6px; }
  .navback, .navedit { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 6px; color: var(--accent); font-size: 16px; font-weight: 500; }
  .navback .ico { width: 22px; height: 22px; margin-left: -6px; } .navtitle { flex: 1; text-align: center; font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: 0; transition: opacity .2s; }
  .detail-head { flex-direction: column; text-align: center; gap: 8px; margin: 2px 0 14px; }
  .detail-head .avatar { width: 72px; height: 72px; font-size: 28px; border-radius: 20px; } .detail-head h2 { font-size: 22px; }
  .detail-actions { justify-content: center; } .detail-actions .back { display: none; }
  .fgroup { display: block; background: var(--panel-2); border: 1px solid var(--line); border-radius: 16px; padding: 0 14px; margin-bottom: 14px; }
  .fgroup .f:first-child { border-top: 0; } .fgroup .note { margin: 12px 0 0; }

  html:not([data-motion=off]) .split.has-sel .detail { animation: push-in calc(.3s / var(--speed, 1)) cubic-bezier(.2, .8, .2, 1); }
  @keyframes push-in { from { transform: translateX(32px); opacity: 0; } }

}
@media (max-width: 699px) {
  /* iOS-style large title on every screen; the logo row becomes the title row */
  .topbar .logo { display: none; }
  .apptitle { display: block; grid-column: 1; grid-row: 1; font: 800 30px/1.1 var(--sans); letter-spacing: -.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 2px 0; }
  .topbar { padding-bottom: 6px; border-bottom: 0; background: linear-gradient(var(--glass), transparent); }
  .topbar .search { border-radius: 12px; background: rgba(128,140,160,.14); border-color: transparent; }
  .main { padding-top: 6px; }
  .page > h2 { display: none; }

  /* bottom sheets: grab handle */

  .modal-header { touch-action: none; }
  .modal-sheet { padding-bottom: env(safe-area-inset-bottom); }
  /* grouped settings rows */
  .setrow { padding: 12px 0; }
}
/* installed (standalone) app: respect the status bar / notch */

/* tablets: a fixed two-column widget grid (an auto-fill grid + 2-column widgets overflowed at ~768px) */

.widget { overflow: hidden; }

  html[data-detail="1"] .topbar { padding-bottom: 0; }
}

[package]
name = "vaultmanager"
version = "0.21.0"
description = "VaultManager — zero-knowledge, end-to-end encrypted password manager (native shell)"
authors = ["ulyweb"]
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
# the library name keeps the mobile entry point linkable (cdylib / staticlib) as well as the desktop binary (rlib)
name = "vaultmanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# only two plugins, both used for one thing: the system "Save as…" dialog for exports and attachment downloads
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
